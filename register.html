<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
            position: relative;
        }
        .bg-pattern {
            position: fixed;
            inset: 0;
            z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
        }
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -2;
            pointer-events: none;
        }
        .bg-orb-1 { width: 500px; height: 500px; top: -100px; right: -100px;
            background: radial-gradient(circle, rgba(230,57,70,0.15), transparent 70%); }
        .bg-orb-2 { width: 500px; height: 500px; bottom: -100px; left: -100px;
            background: radial-gradient(circle, rgba(10,10,10,0.08), transparent 70%); }

        .auth-back {
            position: fixed;
            top: 56px;
            left: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            z-index: 10;
        }
        .auth-back:hover { transform: translateX(-4px); color: #e63946; }

        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%;
            max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
            position: relative;
            overflow: hidden;
        }
        .auth-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        .auth-h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
            color: #0a0a0a;
            margin-bottom: 8px;
        }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: #0a0a0a;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            font-size: 0.9rem;
            color: #0a0a0a;
            outline: none;
            transition: all 0.25s;
        }
        .auth-field input::placeholder { color: #6b7280; opacity: 0.6; }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }

        .auth-check {
            display: inline-flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #6b7280;
            user-select: none;
            margin-top: 4px;
        }
        .auth-check input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px; height: 18px;
            min-width: 18px;
            border: 1.5px solid #0a0a0a;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            position: relative;
            margin: 0;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .auth-check input[type="checkbox"]:checked { background: #0a0a0a; }
        .auth-check input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 5px; top: 1px;
            width: 5px; height: 10px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .auth-check a { color: #e63946; text-decoration: none; font-weight: 600; }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            margin-top: 4px;
        }
        .auth-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(230,57,70,0.5), transparent);
            transition: left 0.5s;
        }
        .auth-btn:hover::before { left: 100%; }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.25); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0a0a0a;
            border-radius: 10px;
            background: transparent;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .auth-btn-outline:hover { background: #0a0a0a; color: #fff; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <a href="index.html" class="auth-back">← Về trang chủ</a>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-head">
                <div class="logo-badge"><span class="logo-qm">QM</span></div>
                <div class="auth-tag">// ĐĂNG KÝ</div>
                <h1 class="auth-h1">Tạo tài khoản <em>mới</em></h1>
                <p class="auth-sub">Đăng ký miễn phí để mua mod</p>
            </div>

            <form class="auth-form" onsubmit="handleRegister(event)">
                <div class="auth-field">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="regUsername" placeholder="username" required minlength="3" autocomplete="username">
                </div>

                <div class="auth-field">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="your-email@example.com" required autocomplete="email">
                </div>

                <div class="auth-field">
                    <label>Mật khẩu</label>
                    <input type="password" id="regPassword" placeholder="Tối thiểu 6 ký tự" minlength="6" required autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="regPassword2" placeholder="Nhập lại mật khẩu" required autocomplete="new-password">
                </div>

                <label class="auth-check">
                    <input type="checkbox" required>
                    <span>Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a></span>
                </label>

                <button type="submit" class="auth-btn">TẠO TÀI KHOẢN</button>
            </form>

            <div class="auth-divider"><span>HOẶC</span></div>

            <a href="login.html" class="auth-btn-outline">ĐÃ CÓ TÀI KHOẢN? ĐĂNG NHẬP</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPassword2').value;

            if (pass !== pass2) return alert('Mật khẩu xác nhận không khớp!');
            if (username.length < 3) return alert('Tên đăng nhập phải có ít nhất 3 ký tự.');

            const btn = e.target.querySelector('button[type="submit"]');
            const oldText = btn.textContent;
            btn.textContent = 'ĐANG TẠO...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password: pass })
                });
                const data = await res.json();

                if (data.success) {
                    alert('Đăng ký thành công!');
                    window.location.href = 'login.html';
                } else {
                    alert(data.error || 'Đăng ký thất bại');
                    btn.textContent = oldText;
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Lỗi kết nối server. Kiểm tra server đang chạy.');
                btn.textContent = oldText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
