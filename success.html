<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xác nhận thanh toán — Shopweb</title>
<link rel="stylesheet" href="/effects.css" />
<style>
  :root{--bg:#0e0f12;--panel:#171922;--line:#262936;--text:#e6e8ef;--muted:#8a8fa3;--accent:#ff4d6d;--ok:#3ddc84;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -10%,#1b1e2b,var(--bg));color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
  .wrap{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;text-align:center}
  .icon{font-size:64px;margin-bottom:14px;line-height:1}
  h1{font-size:22px;margin-bottom:8px}
  p{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.6}
  .spinner{width:44px;height:44px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;margin:14px auto;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ok{color:var(--ok)}
  .ord{font-size:12px;color:var(--muted);margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .ord b{color:var(--text);font-family:monospace}
  a.btn{display:inline-block;margin-top:16px;padding:11px 22px;background:var(--accent);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon" id="icon">⏳</div>
  <h1 id="title">Đang xác nhận thanh toán…</h1>
  <p id="sub">Vui lòng đợi, hệ thống đang kiểm tra giao dịch từ ngân hàng.</p>
  <div class="spinner" id="spin"></div>
  <div class="ord">Mã đơn: <b id="orderId">—</b></div>
  <a class="btn" id="link" href="/" style="display:none">Về trang chủ</a>
</div>
<script>
(() => {
  const p = new URLSearchParams(location.search);
  const orderCode = p.get("order") || sessionStorage.getItem("lastOrder");
  const $ = id => document.getElementById(id);
  $("orderId").textContent = orderCode || "—";

  if (!orderCode) {
    $("icon").textContent = "❌";
    $("title").textContent = "Không tìm thấy đơn hàng";
    $("spin").style.display = "none";
    $("link").style.display = "inline-block";
    return;
  }

  let tries = 0;
  const MAX = 100; // 5 phút

  async function poll() {
    tries++;
    try {
      const r = await fetch(`/api/order/${orderCode}/status`);
      const d = await r.json();

      if (d.delivered) {
        $("icon").textContent = "✅";
        $("title").textContent = "Thanh toán thành công!";
        $("title").className = "ok";
        $("sub").textContent = "Link tải IPA đã được gửi về email của bạn. Kiểm tra hộp thư (kể cả spam).";
        $("spin").style.display = "none";
        $("link").style.display = "inline-block";
        return;
      }
      if (d.paid) $("title").textContent = "Đã nhận thanh toán, đang gửi mail…";

      if (tries >= MAX) {
        $("icon").textContent = "⏱";
        $("title").textContent = "Chưa nhận được thanh toán";
        $("sub").textContent = "Nếu đã CK, liên hệ Zalo 0383415468 kèm mã đơn.";
        $("spin").style.display = "none";
        $("link").style.display = "inline-block";
        return;
      }
      setTimeout(poll, 3000);
    } catch { setTimeout(poll, 5000); }
  }
  poll();
})();
</script>
</body>
</html>
