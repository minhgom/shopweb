<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -2; }
        .bg-orb-1 { width: 500px; height: 500px; top: -100px; right: -100px;
            background: radial-gradient(circle, rgba(230,57,70,0.15), transparent 70%); }
        .bg-orb-2 { width: 500px; height: 500px; bottom: -100px; left: -100px;
            background: radial-gradient(circle, rgba(10,10,10,0.08), transparent 70%); }

        .auth-back {
            position: fixed; top: 56px; left: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            z-index: 10;
        }
        .auth-back:hover { transform: translateX(-4px); color: #e63946; }

        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%; max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
            position: relative;
            overflow: hidden;
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
        }
        .auth-h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s;
        }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 4px;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.25); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
