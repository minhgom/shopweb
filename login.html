<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .auth-back {
            position: fixed; top: 56px; left: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10;
        }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%; max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
        }
        .auth-h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.9);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }
        .auth-forgot { text-align: right; margin-top: -6px; }
        .auth-forgot a { font-size: 0.8rem; color: #6b7280; text-decoration: none; font-weight: 600; }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-msg {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            min-height: 20px;
            word-break: break-word;
        }
        .auth-msg:empty { display: none; }
        .auth-msg.err { color: #fff; background: #e63946; }
        .auth-msg.ok { color: #fff; background: #16a34a; }
        .auth-msg.info { color: #0a0a0a; background: #f5f5f7; font-size: 0.82rem; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0a0a0a;
            border-radius: 10px;
            background: transparent;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }
    </style>
    <script src="auth.js"></script>
</head>
<body>

    <div class="bg-pattern"></div>
    <a href="index.html" class="auth-back">← Về trang chủ</a>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-head">
                <div class="logo-badge"><span class="logo-qm">QM</span></div>
                <div class="auth-tag">// ĐĂNG NHẬP</div>
                <h1 class="auth-h1">Chào mừng <em>trở lại</em></h1>
                <p class="auth-sub">Nhập email và mật khẩu để tiếp tục</p>
            </div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input type="text" id="loginEmail" placeholder="admin hoặc your@email.com" autocomplete="username" autocapitalize="none" autocorrect="off">
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="auth-forgot"><a href="forgot.html">Quên mật khẩu?</a></div>

                <button type="button" class="auth-btn" id="loginBtn">ĐĂNG NHẬP</button>
                <div class="auth-msg" id="loginMsg"></div>
            </div>

            <div class="auth-divider"><span>HOẶC</span></div>

            <a href="register.html" class="auth-btn-outline">TẠO TÀI KHOẢN MỚI</a>
        </div>
    </div>

    <script>
        var loginBusy = false;

        function showMsg(text, type) {
            var el = document.getElementById('loginMsg');
            if (!el) return;
            el.textContent = text;
            el.className = 'auth-msg ' + (type || '');
        }

        function resetBtn() {
            var btn = document.getElementById('loginBtn');
            btn.textContent = 'ĐĂNG NHẬP';
            btn.disabled = false;
            loginBusy = false;
        }

        function goAfterLogin(user) {
            // Dùng replace để không quay lại trang login bằng nút Back
            if (user && user.is_admin) window.location.replace('/admin.html');
            else window.location.replace('/index.html');
        }

        function doLogin() {
            if (loginBusy) return;

            var email = (document.getElementById('loginEmail').value || '').trim();
            var pass = document.getElementById('loginPassword').value || '';

            if (!email || !pass) {
                showMsg('⚠ Vui lòng nhập đầy đủ email và mật khẩu', 'err');
                return;
            }

            loginBusy = true;
            var btn = document.getElementById('loginBtn');
            btn.textContent = 'ĐANG ĐĂNG NHẬP...';
            btn.disabled = true;
            showMsg('⏳ Đang đăng nhập...', 'info');

            // Server miễn phí trên Render có thể "ngủ", lần đầu mất ~30-60 giây
            var slowTimer = setTimeout(function () {
                showMsg('⏳ Server đang khởi động, vui lòng đợi thêm chút (có thể mất tới 1 phút)...', 'info');
            }, 4000);

            fetch('/api/login', {
                method: 'POST',
                credentials: 'same-origin',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pass })
            })
            .then(function (r) {
                return r.text().then(function (txt) {
                    var data = null;
                    try { data = JSON.parse(txt); } catch (e) {}
                    return { ok: r.ok, status: r.status, data: data };
                });
            })
            .then(function (res) {
                clearTimeout(slowTimer);

                if (!res.data) {
                    showMsg('❌ Server trả về dữ liệu không hợp lệ (mã ' + res.status + ')', 'err');
                    resetBtn();
                    return;
                }
                if (!res.ok || !res.data.success) {
                    showMsg('❌ ' + (res.data.error || 'Đăng nhập thất bại'), 'err');
                    resetBtn();
                    return;
                }

                // Lưu token dự phòng (dùng khi cookie bị chặn), rồi xác nhận phiên trước khi chuyển trang
                if (window.QMAuth) QMAuth.save(res.data);
                return fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
                    .then(function (r) { return r.json(); })
                    .then(function (me) {
                        if (!me || !me.logged) {
                            showMsg('❌ Đăng nhập được nhưng server không nhận ra phiên. Mở /api/health: nếu "cookie_secret_from_env" là false hoặc "users" chỉ có 1 thì cần đặt COOKIE_SECRET và giữ database (xem hướng dẫn).', 'err');
                            resetBtn();
                            return;
                        }
                        showMsg('✅ Đăng nhập thành công! Đang chuyển trang...', 'ok');
                        setTimeout(function () { goAfterLogin(me.user); }, 400);
                    });
            })
            .catch(function (err) {
                clearTimeout(slowTimer);
                showMsg('❌ Không kết nối được server: ' + err.message, 'err');
                resetBtn();
            });
        }

        document.getElementById('loginBtn').addEventListener('click', doLogin);
        ['loginEmail', 'loginPassword'].forEach(function (id) {
            document.getElementById(id).addEventListener('keydown', function (e) {
                if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
            });
        });

        // Nếu đã đăng nhập sẵn thì khỏi hiện form
        fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
            .then(function (r) { return r.json(); })
            .then(function (me) { if (me && me.logged) goAfterLogin(me.user); })
            .catch(function () {});
    </script>
</body>
</html>
