<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .auth-back {
            position: fixed; top: 56px; left: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10;
        }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%; max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
        }
        .auth-h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.9);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
        }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-msg {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            min-height: 20px;
            word-break: break-all;
        }
        .auth-msg.err { color: #fff; background: #e63946; }
        .auth-msg.ok { color: #fff; background: #16a34a; }
        .auth-msg.info { color: #0a0a0a; background: #f5f5f7; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-align: left; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0a0a0a;
            border-radius: 10px;
            background: transparent;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <a href="index.html" class="auth-back">← Về trang chủ</a>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-head">
                <div class="logo-badge"><span class="logo-qm">QM</span></div>
                <div class="auth-tag">// ĐĂNG NHẬP</div>
                <h1 class="auth-h1">Chào mừng <em>trở lại</em></h1>
                <p class="auth-sub">Nhập email và mật khẩu để tiếp tục</p>
            </div>

            <div class="auth-form">
                <div class="auth-field">
                    <label>Email</label>
                    <input type="text" id="loginEmail" placeholder="admin hoặc your@email.com">
                </div>

                <div class="auth-field">
                    <label>Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <button type="button" class="auth-btn" id="loginBtn">ĐĂNG NHẬP</button>
                <div class="auth-msg" id="loginMsg"></div>
            </div>

            <div class="auth-divider"><span>HOẶC</span></div>

            <a href="register.html" class="auth-btn-outline">TẠO TÀI KHOẢN MỚI</a>
        </div>
    </div>

    <script>
        // ===== BƯỚC 1: DEBUG NGAY KHI LOAD =====
        function showMsg(text, type) {
            var el = document.getElementById('loginMsg');
            if (!el) return;
            el.textContent = text;
            el.className = 'auth-msg ' + (type || '');
        }

        // ===== BƯỚC 2: HÀM LOGIN =====
        function doLogin() {
            var emailEl = document.getElementById('loginEmail');
            var passEl = document.getElementById('loginPassword');
            var btn = document.getElementById('loginBtn');

            var email = (emailEl.value || '').trim();
            var pass = passEl.value || '';

            if (!email || !pass) {
                showMsg('⚠ Vui lòng nhập đầy đủ email và mật khẩu', 'err');
                return;
            }

            btn.textContent = 'ĐANG ĐĂNG NHẬP...';
            btn.disabled = true;
            showMsg('⏳ Đang gửi yêu cầu tới server...', 'info');

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pass })
            })
            .then(function(r) {
                // Đọc response dạng text trước để debug
                return r.text().then(function(txt) {
                    var data;
                    try { data = JSON.parse(txt); } catch(e) {
                        data = { parseError: true, raw: txt.slice(0, 300) };
                    }
                    return { ok: r.ok, status: r.status, data: data };
                });
            })
            .then(function(res) {
                // Hiển thị toàn bộ response lên màn hình
                var debugText = 'STATUS: ' + res.status + '\n' +
                                'BODY: ' + JSON.stringify(res.data, null, 2);
                showMsg(debugText, 'info');

                if (!res.ok) {
                    setTimeout(function() {
                        showMsg('❌ Lỗi ' + res.status + ': ' + (res.data.error || 'Server error'), 'err');
                    }, 2000);
                    btn.textContent = 'ĐĂNG NHẬP';
                    btn.disabled = false;
                    return;
                }

                if (!res.data || !res.data.success) {
                    setTimeout(function() {
                        showMsg('❌ ' + ((res.data && res.data.error) || 'Đăng nhập thất bại'), 'err');
                    }, 2000);
                    btn.textContent = 'ĐĂNG NHẬP';
                    btn.disabled = false;
                    return;
                }

                // THÀNH CÔNG
                setTimeout(function() {
                    showMsg('✅ Đăng nhập thành công! Đang chuyển hướng...', 'ok');
                }, 1500);

                setTimeout(function() {
                    if (res.data.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                }, 2500);
            })
            .catch(function(err) {
                showMsg('❌ LỖI FETCH: ' + err.message + '\n\nKiểm tra:\n- Server có chạy không?\n- URL /api/login có đúng không?', 'err');
                btn.textContent = 'ĐĂNG NHẬP';
                btn.disabled = false;
            });
        }

        // ===== BƯỚC 3: GẮN EVENT =====
        document.getElementById('loginBtn').addEventListener('click', doLogin);

        document.getElementById('loginEmail').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
        });
        document.getElementById('loginPassword').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
        });

        // Thông báo đã sẵn sàng
        showMsg('✓ Trang đã sẵn sàng. Nhập thông tin rồi bấm ĐĂNG NHẬP.', 'info');
    </script>
</body>
</html>
