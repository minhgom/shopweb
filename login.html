<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập — QM MOD iOS</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="effects.css">
<style>
.auth-wrap {
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    padding: 100px 20px 60px;
}
.auth-card {
    width: 100%; max-width: 420px;
    padding: 40px 32px;
    background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px; box-shadow: var(--shadow-lg);
    position: relative; overflow: hidden;
    animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
.auth-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,1), transparent);
}

.auth-logo {
    width: 64px; height: 64px;
    background: #0a0a0a; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    font-weight: 800; font-size: 22px; color: #fff;
    letter-spacing: -0.02em;
    box-shadow: 0 12px 32px rgba(10,10,10,0.2);
}
.auth-tag {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.22em;
    color: var(--accent); text-transform: uppercase;
    margin-bottom: 12px; font-weight: 700;
}
.auth-title {
    text-align: center; font-size: 1.8rem; font-weight: 900;
    letter-spacing: -0.03em; line-height: 1.15;
    color: var(--text); margin-bottom: 8px;
}
.auth-title em {
    color: var(--accent); font-style: italic; font-weight: 900;
}
.auth-sub {
    text-align: center; font-size: 0.85rem; color: var(--text-2);
    margin-bottom: 30px; font-weight: 500;
}

.form-group { margin-bottom: 16px; }
.form-group label {
    display: block; font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text); margin-bottom: 8px;
}
.form-group input {
    width: 100%; padding: 13px 16px; border-radius: 11px;
    border: 1.5px solid var(--line-2); background: rgba(255,255,255,0.7);
    font-family: inherit; font-size: 0.9rem; color: var(--text);
    outline: none; transition: all 0.25s;
}
.form-group input:focus {
    border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 3px rgba(230,57,70,0.1);
}

.field-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; flex-wrap: wrap; gap: 10px;
}
.checkbox-wrap {
    display: flex; align-items: center; gap: 8px;
    cursor: pointer; font-size: 0.82rem; color: var(--text-2); font-weight: 500;
}
.checkbox-wrap input[type="checkbox"] {
    width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
}
.forgot-link {
    font-size: 0.82rem; color: var(--accent);
    text-decoration: none; font-weight: 700;
}
.forgot-link:hover { text-decoration: underline; }

.divider {
    display: flex; align-items: center; gap: 16px;
    margin: 24px 0; color: var(--text-3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem; letter-spacing: 0.2em;
    text-transform: uppercase; font-weight: 600;
}
.divider::before, .divider::after {
    content: ''; flex: 1; height: 1px; background: var(--line-2);
}

.auth-msg {
    margin-top: 14px; font-size: 0.85rem;
    text-align: center; min-height: 20px; font-weight: 600;
}
.auth-msg.ok { color: #16a34a; }
.auth-msg.err { color: var(--accent); }

.auth-footer {
    text-align: center; margin-top: 24px;
    font-size: 0.82rem; color: var(--text-2); font-weight: 500;
}
.auth-footer a {
    color: var(--accent); text-decoration: none; font-weight: 700;
}
.auth-footer a:hover { text-decoration: underline; }

@media (max-width: 480px) {
    .auth-card { padding: 32px 22px; }
    .auth-title { font-size: 1.5rem; }
    .auth-logo { width: 56px; height: 56px; font-size: 19px; }
}
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="auth-wrap">
    <div class="auth-card">

        <div class="auth-logo">QM</div>
        <div class="auth-tag">// ĐĂNG NHẬP</div>
        <h1 class="auth-title">Chào mừng <em>trở lại</em></h1>
        <p class="auth-sub">Nhập email và mật khẩu để tiếp tục</p>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label>Email hoặc tên đăng nhập</label>
                <input type="text" id="email" placeholder="admin hoặc your@email.com" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>

            <div class="field-row">
                <label class="checkbox-wrap">
                    <input type="checkbox" id="remember">
                    <span>Ghi nhớ</span>
                </label>
                <a href="forgot.html" class="forgot-link">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="loginBtn">ĐĂNG NHẬP</button>
            <div class="auth-msg" id="msg"></div>
        </form>

        <div class="divider">HOẶC</div>

        <a href="register.html" class="btn btn-outline btn-full">TẠO TÀI KHOẢN MỚI</a>

        <div class="auth-footer">
            <a href="index.html">← Về trang chủ</a>
        </div>

    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msg = (text, kind = '') => {
    const el = $('msg');
    el.textContent = text;
    el.className = 'auth-msg ' + kind;
};

$('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;

    if (!email || !password) return msg('Vui lòng nhập đầy đủ thông tin', 'err');

    const btn = $('loginBtn');
    btn.textContent = 'ĐANG ĐĂNG NHẬP...';
    btn.disabled = true;

    try {
        const r = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.error || 'Đăng nhập thất bại');

        msg('Đăng nhập thành công! Đang chuyển...', 'ok');
        setTimeout(() => {
            location.href = d.role === 'admin' ? '/admin.html' : '/';
        }, 700);
    } catch (err) {
        msg('Lỗi: ' + err.message, 'err');
        btn.textContent = 'ĐĂNG NHẬP';
        btn.disabled = false;
    }
});
</script>
</body>
</html>
