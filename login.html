<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
            position: relative;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -2; }
        .bg-orb-1 { width: 500px; height: 500px; top: -100px; right: -100px;
            background: radial-gradient(circle, rgba(230,57,70,0.15), transparent 70%); }
        .bg-orb-2 { width: 500px; height: 500px; bottom: -100px; left: -100px;
            background: radial-gradient(circle, rgba(10,10,10,0.08), transparent 70%); }

        .auth-back {
            position: fixed; top: 56px; left: 24px;
            padding: 10px 18px;
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            color: #0a0a0a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 10;
        }
        .auth-back:hover { color: #e63946; }

        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%; max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
        }
        .auth-h1 {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.7);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }

        .auth-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .auth-check {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            color: #6b7280;
        }
        .auth-check input[type="checkbox"] {
            width: 16px; height: 16px;
            cursor: pointer;
        }
        .auth-forgot {
            color: #e63946;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.25); }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-msg {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 20px;
            margin-top: 4px;
        }
        .auth-msg.err { color: #e63946; }
        .auth-msg.ok { color: #16a34a; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0a0a0a;
            border-radius: 10px;
            background: transparent;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-btn-outline:hover { background: #0a0a0a; color: #fff; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <a href="index.html" class="auth-back">← Về trang chủ</a>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-head">
                <div class="logo-badge"><span class="logo-qm">QM</span></div>
                <div class="auth-tag">// ĐĂNG NHẬP</div>
                <h1 class="auth-h1">Chào mừng <em>trở lại</em></h1>
                <p class="auth-sub">Nhập email và mật khẩu để tiếp tục</p>
            </div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="your-email@example.com" autocomplete="email">
                </div>

                <div class="auth-field">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                </div>

                <div class="auth-row">
                    <label class="auth-check">
                        <input type="checkbox" id="remember">
                        <span>Ghi nhớ</span>
                    </label>
                    <a href="forgot.html" class="auth-forgot">Quên mật khẩu?</a>
                </div>

                <button type="button" class="auth-btn" id="loginBtn">ĐĂNG NHẬP</button>
                <div class="auth-msg" id="loginMsg"></div>
            </div>

            <div class="auth-divider"><span>HOẶC</span></div>

            <a href="register.html" class="auth-btn-outline">TẠO TÀI KHOẢN MỚI</a>
        </div>
    </div>

    <script>
        console.log('[login] script loaded');

        function showMsg(text, type) {
            var el = document.getElementById('loginMsg');
            el.textContent = text;
            el.className = 'auth-msg ' + (type || '');
        }

        function doLogin() {
            var emailEl = document.getElementById('loginEmail');
            var passEl = document.getElementById('loginPassword');
            var btn = document.getElementById('loginBtn');

            var email = (emailEl.value || '').trim();
            var pass = passEl.value || '';

            console.log('[login] click submit:', email);

            if (!email || !pass) {
                showMsg('Vui lòng nhập đầy đủ thông tin', 'err');
                return;
            }

            btn.textContent = 'ĐANG ĐĂNG NHẬP...';
            btn.disabled = true;
            showMsg('Đang kiểm tra...', '');

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: pass })
            })
            .then(function(r) {
                return r.text().then(function(t) {
                    var data;
                    try { data = JSON.parse(t); } catch(e) { data = { raw: t }; }
                    return { ok: r.ok, status: r.status, data: data };
                });
            })
            .then(function(res) {
                console.log('[login] response:', res);

                if (!res.ok) {
                    showMsg('Lỗi ' + res.status + ': ' + (res.data.error || 'Server không phản hồi'), 'err');
                    btn.textContent = 'ĐĂNG NHẬP';
                    btn.disabled = false;
                    return;
                }

                if (!res.data.success) {
                    showMsg(res.data.error || 'Đăng nhập thất bại', 'err');
                    btn.textContent = 'ĐĂNG NHẬP';
                    btn.disabled = false;
                    return;
                }

                try { localStorage.setItem('user', JSON.stringify(res.data.user)); } catch(e) {}

                showMsg('Đăng nhập thành công! Đang chuyển...', 'ok');

                setTimeout(function() {
                    if (res.data.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/';
                    }
                }, 600);
            })
            .catch(function(err) {
                console.error('[login] fetch error:', err);
                showMsg('Lỗi kết nối: ' + err.message, 'err');
                btn.textContent = 'ĐĂNG NHẬP';
                btn.disabled = false;
            });
        }

        // Gắn event sau khi DOM load
        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.getElementById('loginBtn');
            var emailEl = document.getElementById('loginEmail');
            var passEl = document.getElementById('loginPassword');

            if (btn) btn.addEventListener('click', doLogin);

            function onEnter(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    doLogin();
                }
            }
            if (emailEl) emailEl.addEventListener('keydown', onEnter);
            if (passEl) passEl.addEventListener('keydown', onEnter);

            console.log('[login] events attached');
        });
    </script>
</body>
</html>
