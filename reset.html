<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 100px 24px 60px;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-box {
            width: 100%; max-width: 440px;
            padding: 40px 36px 32px;
            border-radius: 24px;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .auth-head { text-align: center; margin-bottom: 28px; }
        .logo-badge {
            width: 52px; height: 52px;
            margin: 0 auto 16px;
            background: #0a0a0a;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.3rem; color: #fff; }
        .auth-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #e63946;
            margin-bottom: 12px;
        }
        .auth-h1 { font-size: 1.6rem; font-weight: 800; line-height: 1.15; margin-bottom: 8px; }
        .auth-h1 em { font-style: italic; color: #e63946; }
        .auth-sub { color: #6b7280; font-size: 0.88rem; }

        .auth-form { display: flex; flex-direction: column; gap: 16px; margin-top: 20px; }
        .auth-field { display: flex; flex-direction: column; gap: 6px; }
        .auth-field label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .auth-field input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(10,10,10,0.15);
            background: rgba(255,255,255,0.9);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }
        .auth-field input:focus {
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.08);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0a0a0a;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .auth-msg {
            text-align: center;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 10px;
            word-break: break-word;
            line-height: 1.5;
        }
        .auth-msg:empty { display: none; }
        .auth-msg.err { color: #fff; background: #e63946; }
        .auth-msg.ok { color: #fff; background: #16a34a; }

        .auth-divider { position: relative; text-align: center; margin: 22px 0; }
        .auth-divider::before {
            content: '';
            position: absolute;
            top: 50%; left: 0; right: 0;
            height: 1px;
            background: rgba(10,10,10,0.08);
        }
        .auth-divider span {
            position: relative;
            display: inline-block;
            padding: 0 14px;
            background: rgba(255,255,255,0.9);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: #6b7280;
            letter-spacing: 0.25em;
            font-weight: 700;
        }
        .auth-btn-outline {
            display: block;
            width: 100%;
            padding: 14px;
            border: 1.5px solid #0a0a0a;
            border-radius: 10px;
            background: transparent;
            color: #0a0a0a;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>

    <div class="auth-page">
        <div class="auth-box">
            <div class="auth-head">
                <div class="logo-badge"><span class="logo-qm">QM</span></div>
                <div class="auth-tag">// ĐẶT LẠI MẬT KHẨU</div>
                <h1 class="auth-h1">Mật khẩu <em>mới</em></h1>
                <p class="auth-sub">Nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>

            <div class="auth-form">
                <div class="auth-field">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
                </div>

                <div class="auth-field">
                    <label for="newPassword2">Xác nhận mật khẩu</label>
                    <input type="password" id="newPassword2" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
                </div>

                <button type="button" class="auth-btn" id="resetBtn">ĐẶT LẠI MẬT KHẨU</button>
                <div class="auth-msg" id="resetMsg"></div>
            </div>

            <div class="auth-divider"><span>HOẶC</span></div>

            <a href="login.html" class="auth-btn-outline">← VỀ ĐĂNG NHẬP</a>
        </div>
    </div>

    <script>
        var busy = false;
        var token = new URLSearchParams(location.search).get('token') || '';

        function showMsg(text, type) {
            var el = document.getElementById('resetMsg');
            el.textContent = text;
            el.className = 'auth-msg ' + (type || '');
        }

        function resetBtnState() {
            var btn = document.getElementById('resetBtn');
            btn.textContent = 'ĐẶT LẠI MẬT KHẨU';
            btn.disabled = false;
            busy = false;
        }

        if (!token || token.length < 20) {
            showMsg('❌ Link không hợp lệ. Vui lòng bấm lại link trong email hoặc yêu cầu gửi lại.', 'err');
            document.getElementById('resetBtn').disabled = true;
        }

        function doReset() {
            if (busy || !token) return;

            var p1 = document.getElementById('newPassword').value || '';
            var p2 = document.getElementById('newPassword2').value || '';

            if (!p1 || !p2) {
                showMsg('⚠ Vui lòng nhập đầy đủ 2 ô mật khẩu', 'err');
                return;
            }
            if (p1.length < 6) {
                showMsg('⚠ Mật khẩu tối thiểu 6 ký tự', 'err');
                return;
            }
            if (p1 !== p2) {
                showMsg('⚠ Hai mật khẩu không khớp', 'err');
                return;
            }

            busy = true;
            var btn = document.getElementById('resetBtn');
            btn.textContent = 'ĐANG XỬ LÝ...';
            btn.disabled = true;
            showMsg('⏳ Đang đặt lại mật khẩu...', 'info');

            fetch('/api/reset', {
                method: 'POST',
                credentials: 'same-origin',
                cache: 'no-store',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: p1 })
            })
            .then(function (r) {
                return r.text().then(function (txt) {
                    var data = null;
                    try { data = JSON.parse(txt); } catch (e) {}
                    return { ok: r.ok, status: r.status, data: data };
                });
            })
            .then(function (res) {
                if (!res.data) {
                    showMsg('❌ Server trả về dữ liệu không hợp lệ (mã ' + res.status + ')', 'err');
                    resetBtnState();
                    return;
                }
                if (!res.ok || !res.data.success) {
                    showMsg('❌ ' + (res.data.error || 'Đặt lại thất bại'), 'err');
                    resetBtnState();
                    return;
                }
                showMsg('✅ Đặt lại mật khẩu thành công! Đang chuyển về trang đăng nhập...', 'ok');
                setTimeout(function () { location.href = 'login.html'; }, 1500);
            })
            .catch(function (err) {
                showMsg('❌ Không kết nối được server: ' + err.message, 'err');
                resetBtnState();
            });
        }

        document.getElementById('resetBtn').addEventListener('click', doReset);
        document.getElementById('newPassword2').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); doReset(); }
        });
    </script>
</body>
</html>
