<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — QM Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb; color: #0a0a0a;
            min-height: 100vh; padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .box {
            background: #fff; border-radius: 16px; padding: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 20px;
        }
        .login-box { max-width: 420px; margin: 100px auto; }
        h1 { font-size: 1.5rem; margin-bottom: 20px; }
        h2 { font-size: 1.1rem; margin-bottom: 16px; }
        .header-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        input, textarea, select {
            width: 100%; padding: 12px 14px; margin-bottom: 10px;
            border-radius: 10px; border: 1.5px solid rgba(10,10,10,0.15);
            background: #f5f6f7; font-family: inherit; font-size: 0.9rem;
            outline: none; transition: all 0.2s;
        }
        textarea { font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; resize: vertical; min-height: 120px; line-height: 1.6; }
        input:focus, textarea:focus, select:focus { border-color: #0a0a0a; background: #fff; }
        label.field-label {
            display: block; font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 6px; color: #6b7280;
        }
        button {
            padding: 12px 22px; background: #0a0a0a; color: #fff; border: none;
            border-radius: 10px; font-weight: 700; font-family: inherit; cursor: pointer;
            font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em;
            transition: all 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.2); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .full { width: 100%; margin-top: 8px; }
        .hint {
            font-size: 0.75rem; color: #6b7280; margin-top: -4px; margin-bottom: 10px;
            font-family: 'JetBrains Mono', monospace; line-height: 1.6;
        }
        .hint code { background: #f0f2f5; padding: 2px 6px; border-radius: 4px; color: #e63946; font-weight: 700; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item {
            padding: 16px 18px; background: #f5f6f7; border-radius: 12px;
            margin-bottom: 10px; font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; flex-wrap: wrap;
        }
        .item b { color: #e63946; }
        .item-content { flex: 1; min-width: 200px; }
        .item-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-reject {
            background: #e63946 !important; color: #fff !important;
            padding: 8px 14px !important; font-size: 0.72rem !important;
        }
        .btn-confirm {
            background: #16a34a !important; color: #fff !important;
            padding: 8px 14px !important; font-size: 0.72rem !important;
        }
        .status {
            display: inline-block; padding: 3px 10px; border-radius: 6px;
            font-size: 0.7rem; font-weight: 700; margin-left: 6px;
        }
        .status-paid { background: #16a34a; color: #fff; }
        .status-pending { background: #f59e0b; color: #fff; }
        .status-failed { background: #e63946; color: #fff; }
        .file-chip {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(22,163,74,0.1); color: #16a34a;
            padding: 3px 8px; border-radius: 6px;
            font-size: 0.68rem; font-weight: 700;
            border: 1px solid rgba(22,163,74,0.25);
            margin: 3px 4px 0 0;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="loginBox" class="box login-box">
        <h1>⚙ Admin Login</h1>
        <input type="text" id="adminUser" placeholder="Username" value="admin">
        <input type="password" id="adminPass" placeholder="Password">
        <button class="full" id="loginBtn">ĐĂNG NHẬP</button>
    </div>

    <div id="panel" style="display:none;">

        <div class="box">
            <div class="header-row">
                <h1>⚙ Admin Panel</h1>
                <button id="logoutBtn">ĐĂNG XUẤT</button>
            </div>
        </div>

        <div class="box">
            <h2>📤 Thêm sản phẩm (nhiều file IPA)</h2>
            <form id="productForm">
                <div class="form-row">
                    <div>
                        <label class="field-label">Tên sản phẩm</label>
                        <input type="text" name="name" placeholder="VD: Bus Simulator Indonesia" required>
                    </div>
                    <div>
                        <label class="field-label">Game</label>
                        <input type="text" name="game" placeholder="VD: BUSSID" required>
                    </div>
                </div>
                <div class="form-row">
                    <div>
                        <label class="field-label">Giá (đồng)</label>
                        <input type="number" name="price" placeholder="VD: 25000" required>
                    </div>
                    <div>
                        <label class="field-label">Link video demo (tuỳ chọn)</label>
                        <input type="url" name="video_url" placeholder="https://...">
                    </div>
                </div>

                <label class="field-label">Danh sách file (mỗi dòng 1 file)</label>
                <textarea id="filesInput" placeholder="ESign 2.0 | https://drive.google.com/file/d/AAA/view | esign.ipa
Bus Simulator Indonesia | https://drive.google.com/file/d/BBB/view | BUSSID.ipa
File xe khách | https://drive.google.com/file/d/CCC/view | XeKhach.zip"></textarea>
                <div class="hint">
                    Định dạng: <code>Tên hiển thị</code> | <code>Link Drive</code> | <code>Tên file khi tải</code><br>
                    Dấu <b>|</b> phân cách bắt buộc. Khách sẽ tải lần lượt từ trên xuống.
                </div>

                <button type="submit" class="full" id="addBtn">THÊM SẢN PHẨM</button>
            </form>
        </div>

        <div class="box">
            <h2>📦 Sản phẩm đã có</h2>
            <div id="productsList"></div>
        </div>

        <div class="box">
            <h2>📋 Đơn hàng</h2>
            <div id="ordersList"></div>
        </div>

    </div>
</div>

<script>
async function adminLogin() {
    const username = document.getElementById('adminUser').value;
    const password = document.getElementById('adminPass').value;
    if (!username || !password) return alert('Nhập username và password');

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
            // Lưu token trực tiếp vào localStorage (thay cho QMAuth.save)
            if (data.admin_token) localStorage.setItem('admin_token', data.admin_token);
            if (data.token) localStorage.setItem('token', data.token);
            if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
            localStorage.setItem('is_admin', '1');

            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
            loadProducts();
            loadOrders();
            setInterval(loadOrders, 30000);
        } else {
            alert('Lỗi: ' + (data.error || 'Sai tài khoản'));
        }
    } catch (err) {
        alert('Lỗi kết nối: ' + err.message);
    }
}

async function adminLogout() {
    try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    // Xoá sạch token (thay cho QMAuth.clear)
    localStorage.removeItem('admin_token');
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    localStorage.removeItem('is_admin');
    location.reload();
}

async function loadProducts() {
    try {
        const res = await fetch('/api/admin/products', { credentials: 'same-origin' });
        const data = await res.json();
        const el = document.getElementById('productsList');
        if (!data.length) {
            el.innerHTML = '<p style="color:#999;">Chưa có sản phẩm</p>';
            return;
        }
        el.innerHTML = data.map(p => {
            const files = p.files || [];
            const chips = files.map(f => `<span class="file-chip">📄 ${f.label}</span>`).join('');
            return `
                <div class="item">
                    <div class="item-content">
                        <b>ID ${p.id}</b> · ${p.name} · ${p.game} · ${p.price.toLocaleString('vi-VN')}đ
                        · <span style="color:#16a34a;">${p.file_count} file</span>
                        <div style="margin-top:6px;">${chips}</div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-reject" data-del-product="${p.id}" data-name="${p.name}">🗑 XOÁ</button>
                    </div>
                </div>
            `;
        }).join('');
        el.querySelectorAll('[data-del-product]').forEach(btn => {
            btn.addEventListener('click', () => deleteProduct(parseInt(btn.dataset.delProduct), btn.dataset.name));
        });
    } catch (err) { console.error(err); }
}

async function loadOrders() {
    try {
        const res = await fetch('/api/admin/orders', { credentials: 'same-origin' });
        const data = await res.json();
        const el = document.getElementById('ordersList');
        if (!data.length) {
            el.innerHTML = '<p style="color:#999;">Chưa có đơn hàng</p>';
            return;
        }
        el.innerHTML = data.map(o => {
            let badge = '';
            if (o.status === 'delivered') badge = '<span class="status status-paid">✓ ĐÃ GỬI</span>';
            else if (o.status === 'pending') badge = '<span class="status status-pending">⏳ CHỜ CK</span>';
            else badge = '<span class="status status-failed">✗ TỪ CHỐI</span>';

            const actions = o.status === 'pending'
                ? `<button class="btn-confirm" data-confirm="${o.order_code}">✓ XÁC NHẬN</button>
                   <button class="btn-reject" data-reject="${o.order_code}">✗ TỪ CHỐI</button>`
                : `<button class="btn-reject" data-delete="${o.order_code}">🗑 XOÁ</button>`;

            return `
                <div class="item">
                    <div class="item-content">
                        <b>${o.order_code}</b> · ${o.user_email || '—'} · ${o.product_name} ${badge}
                        <div style="font-size:0.75rem;color:#999;margin-top:4px;">
                            ${o.amount ? o.amount.toLocaleString('vi-VN') + 'đ · ' : ''}${new Date(o.created_at).toLocaleString('vi-VN')}
                        </div>
                    </div>
                    <div class="item-actions">${actions}</div>
                </div>
            `;
        }).join('');
        el.querySelectorAll('[data-confirm]').forEach(b => b.addEventListener('click', () => confirmOrder(b.dataset.confirm)));
        el.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', () => rejectOrder(b.dataset.reject)));
        el.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteOrder(b.dataset.delete)));
    } catch (err) { console.error(err); }
}

async function confirmOrder(code) {
    if (!confirm('Xác nhận đã nhận tiền cho đơn ' + code + '? Sẽ gửi mail link tải ngay.')) return;
    try {
        const res = await fetch('/api/admin/confirm-order/' + code, { method: 'POST', credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) { alert('✓ Đã xác nhận ' + code); loadOrders(); }
        else alert('Lỗi: ' + data.error);
    } catch (err) { alert('Lỗi: ' + err.message); }
}

async function rejectOrder(code) {
    if (!confirm('Từ chối đơn ' + code + '?')) return;
    try {
        const res = await fetch('/api/admin/reject-order/' + code, { method: 'POST', credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) { alert('✗ Đã từ chối ' + code); loadOrders(); }
        else alert('Lỗi: ' + data.error);
    } catch (err) { alert('Lỗi: ' + err.message); }
}

async function deleteOrder(code) {
    if (!confirm('Xoá vĩnh viễn đơn ' + code + '?')) return;
    try {
        const res = await fetch('/api/admin/delete-order/' + code, { method: 'POST', credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) { alert('🗑 Đã xoá ' + code); loadOrders(); }
        else alert('Lỗi: ' + data.error);
    } catch (err) { alert('Lỗi: ' + err.message); }
}

async function deleteProduct(id, name) {
    if (!confirm('Xoá sản phẩm "' + name + '"?')) return;
    try {
        const res = await fetch('/api/admin/delete-product/' + id, { method: 'POST', credentials: 'same-origin' });
        const data = await res.json();
        if (data.success) { alert('🗑 Đã xoá'); loadProducts(); }
        else alert('Lỗi: ' + data.error);
    } catch (err) { alert('Lỗi: ' + err.message); }
}

document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('loginBtn').addEventListener('click', adminLogin);
    document.getElementById('logoutBtn').addEventListener('click', adminLogout);
    document.getElementById('adminPass').addEventListener('keypress', e => {
        if (e.key === 'Enter') adminLogin();
    });

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const form = e.target;

        const lines = document.getElementById('filesInput').value
            .split('\n').map(l => l.trim()).filter(Boolean);

        if (!lines.length) return alert('Nhập ít nhất 1 file!');

        const files = [];
        for (const line of lines) {
            const parts = line.split('|').map(s => s.trim());
            const label = parts[0] || 'File';
            const url = parts[1] || '';
            const fname = parts[2] || `${label}.ipa`;

            if (!url) return alert('Thiếu link Drive ở dòng:\n' + line);
            if (!/drive\.google\.com/.test(url)) return alert('Link không phải Google Drive:\n' + line);

            files.push({ label, url, name: fname, mime: 'application/octet-stream' });
        }

        const body = {
            name: form.name.value.trim(),
            game: form.game.value.trim(),
            price: parseInt(form.price.value),
            video_url: form.video_url.value.trim(),
            files
        };

        if (!body.name || !body.game || !body.price) return alert('Điền đủ tên, game, giá');

        const btn = document.getElementById('addBtn');
        btn.textContent = 'ĐANG LƯU...';
        btn.disabled = true;

        try {
            const res = await fetch('/api/admin/upload-product', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) {
                alert('✓ Thêm thành công! Số file: ' + data.file_count);
                form.reset();
                document.getElementById('filesInput').value = '';
                loadProducts();
            } else {
                alert('Lỗi: ' + data.error);
            }
        } catch (err) {
            alert('Lỗi: ' + err.message);
        }
        btn.textContent = 'THÊM SẢN PHẨM';
        btn.disabled = false;
    });
});
</script>
</body>
</html>
