<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho tải về — By:QuangMinh</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #f4f6fb;
            color: #0a0a0a;
            min-height: 100vh;
            padding: 120px 24px 60px;
            position: relative;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: -3;
            background-image:
                linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        .bg-orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -2; }
        .bg-orb-1 { width: 500px; height: 500px; top: -100px; right: -100px;
            background: radial-gradient(circle, rgba(230,57,70,0.15), transparent 70%); }
        .bg-orb-2 { width: 500px; height: 500px; bottom: -100px; left: -100px;
            background: radial-gradient(circle, rgba(10,10,10,0.08), transparent 70%); }

        .navbar {
            position: fixed; top: 44px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: 1200px; z-index: 100;
            padding: 12px 20px;
            background: rgba(255,255,255,0.55); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85); border-radius: 14px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0a0a0a; }
        .logo-badge {
            width: 40px; height: 40px; background: #0a0a0a; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-qm { font-weight: 800; font-size: 1.1rem; color: #fff; }
        .logo-main { font-weight: 800; font-size: 1rem; display: block; line-height: 1; }
        .logo-main i { color: #e63946; font-style: normal; }
        .logo-sub { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
            color: #6b7280; letter-spacing: 0.1em; display: block; margin-top: 3px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #6b7280; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
        .nav-links a:hover { color: #e63946; }

        .section { max-width: 900px; margin: 0 auto; }
        .section-header { margin-bottom: 40px; border-left: 4px solid #e63946; padding-left: 20px; }
        .section-tag {
            font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
            font-weight: 700; letter-spacing: 0.2em; color: #e63946;
            margin-bottom: 12px; text-transform: uppercase; display: inline-block;
        }
        .section-title {
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            font-weight: 800; color: #0a0a0a; margin-bottom: 8px;
        }
        .section-subtitle {
            color: #6b7280; font-size: 0.9rem;
            font-family: 'JetBrains Mono', monospace;
        }

        .download-item {
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .download-info h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; }
        .download-info p {
            font-size: 0.82rem; color: #6b7280;
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 4px;
        }
        .download-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .download-code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(230,57,70,0.1);
            color: #e63946;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid rgba(230,57,70,0.3);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            margin-top: 6px;
        }
        .status-paid { background: #16a34a; color: #fff; }
        .status-pending { background: #f59e0b; color: #fff; }
        .status-failed { background: #e63946; color: #fff; }

        .btn {
            padding: 12px 22px; border: none; border-radius: 10px;
            font-size: 0.85rem; font-weight: 700; font-family: inherit;
            cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; text-transform: uppercase; letter-spacing: 0.03em;
            transition: all 0.3s;
        }
        .btn-primary { background: #0a0a0a; color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.3); }
        .btn-outline {
            background: transparent; color: #0a0a0a;
            border: 1.5px solid #0a0a0a;
        }
        .btn-outline:hover { background: #0a0a0a; color: #fff; }
        .btn-sm { padding: 9px 16px; font-size: 0.78rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .empty-box {
            text-align: center;
            padding: 80px 20px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.85);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(10,10,10,0.08);
        }
        .empty-box h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; }
        .empty-box p { color: #6b7280; font-size: 0.9rem; margin-bottom: 24px; }
    </style>
</head>
<body>

    <div class="bg-pattern"></div>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <nav class="navbar">
        <a href="index.html" class="logo">
            <div class="logo-badge"><span class="logo-qm">QM</span></div>
            <div>
                <span class="logo-main">MOD<i>iOS</i></span>
                <span class="logo-sub">By:QuangMinh</span>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Trang chủ</a>
            <a href="#" id="logoutBtn">Đăng xuất</a>
        </div>
    </nav>

    <section class="section">
        <div class="section-header">
            <span class="section-tag">// KHO TẢI VỀ</span>
            <h2 class="section-title">SẢN PHẨM CỦA BẠN</h2>
            <p class="section-subtitle" id="userEmail"></p>
        </div>

        <div id="downloadsList">Đang tải...</div>
    </section>

    <script>
        async function loadDownloads() {
            try {
                const meRes = await fetch('/api/me');
                if (!meRes.ok) {
                    window.location.href = 'login.html';
                    return;
                }
                const me = await meRes.json();
                document.getElementById('userEmail').textContent = me.user.email;

                const res = await fetch('/api/my-downloads');
                const data = await res.json();
                const el = document.getElementById('downloadsList');

                if (!data.downloads || data.downloads.length === 0) {
                    el.innerHTML = `
                        <div class="empty-box">
                            <h3>📁 Kho tải về trống</h3>
                            <p>Bạn chưa có đơn hàng nào.</p>
                            <a href="index.html" class="btn btn-primary">← VỀ TRANG CHỦ</a>
                        </div>
                    `;
                    return;
                }

                el.innerHTML = data.downloads.map(d => {
                    let statusBadge = '';
                    let actionBtns = '';

                    if (d.status === 'paid') {
                        statusBadge = '<span class="status-badge status-paid">✓ ĐÃ THANH TOÁN</span>';
                        actionBtns = `
                            ${d.video_url ? `<a href="${d.video_url}" target="_blank" class="btn btn-outline btn-sm">🎥 VIDEO HD</a>` : ''}
                            <button class="btn btn-primary btn-sm" data-download="${d.order_code}">⬇ TẢI FILE IPA</button>
                        `;
                    } else if (d.status === 'pending') {
                        statusBadge = '<span class="status-badge status-pending">⏳ CHỜ XÁC NHẬN</span>';
                        actionBtns = `
                            <button class="btn btn-outline btn-sm" data-check="${d.order_code}">🔄 KIỂM TRA</button>
                            <button class="btn btn-primary btn-sm" disabled>⏳ ĐANG CHỜ</button>
                        `;
                    } else {
                        statusBadge = '<span class="status-badge status-failed">✗ THẤT BẠI</span>';
                        actionBtns = `<a href="index.html" class="btn btn-outline btn-sm">↻ MUA LẠI</a>`;
                    }

                    return `
                        <div class="download-item">
                            <div class="download-info">
                                <h3>${d.product_name}</h3>
                                <p>${d.game} · Đơn: <span class="download-code">${d.order_code}</span></p>
                                <div>${statusBadge}</div>
                            </div>
                            <div class="download-actions">${actionBtns}</div>
                        </div>
                    `;
                }).join('');

                el.querySelectorAll('[data-download]').forEach(btn => {
                    btn.addEventListener('click', () => downloadFile(btn.dataset.download));
                });
                el.querySelectorAll('[data-check]').forEach(btn => {
                    btn.addEventListener('click', () => checkStatus(btn.dataset.check));
                });
            } catch (err) {
                alert('Lỗi: ' + err.message);
            }
        }

        async function downloadFile(orderCode) {
            try {
                const res = await fetch('/api/download/' + orderCode);
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.url;
                } else {
                    alert('Lỗi: ' + data.error);
                }
            } catch (err) {
                alert('Lỗi kết nối: ' + err.message);
            }
        }

        async function checkStatus(orderCode) {
            try {
                const res = await fetch('/api/order-status/' + orderCode);
                const data = await res.json();
                if (data.status === 'paid') {
                    alert('Đơn đã được xác nhận! Tải file ngay.');
                    loadDownloads();
                } else if (data.status === 'pending') {
                    alert('Đơn vẫn đang chờ admin xác nhận. Vui lòng đợi thêm.');
                } else {
                    alert('Đơn đã bị từ chối.');
                    loadDownloads();
                }
            } catch (err) {
                alert('Lỗi: ' + err.message);
            }
        }

        async function logout() {
            await fetch('/api/logout', { method: 'POST' });
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });

        loadDownloads();
        setInterval(loadDownloads, 30000);
    </script>
</body>
</html>
