<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tải file IPA — QM MOD iOS</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Be Vietnam Pro', sans-serif; background: #f4f6fb; color: #0a0a0a; min-height: 100vh; padding: 40px 16px; }
.bg-pattern { position: fixed; inset: 0; z-index: -3;
  background-image: linear-gradient(rgba(10,10,10,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(10,10,10,0.03) 1px, transparent 1px);
  background-size: 50px 50px; }
.container { max-width: 640px; margin: 0 auto; }
.head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; padding: 16px 20px; background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
.head a { text-decoration: none; color: #0a0a0a; font-weight: 700; font-size: 0.85rem; }
.head .back { color: #6b7280; font-weight: 600; }
.section-header { margin-bottom: 24px; padding-left: 16px; border-left: 4px solid #e63946; }
.section-tag { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #e63946; letter-spacing: 0.22em; margin-bottom: 8px; font-weight: 700; }
.section-title { font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
.section-sub { color: #6b7280; font-size: 0.85rem; }
.success-block { text-align: center; margin-bottom: 24px; }
.success-icon { width: 72px; height: 72px; margin: 0 auto 14px; background: linear-gradient(135deg, #16a34a, #22c55e); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #fff; font-weight: 900; box-shadow: 0 12px 32px rgba(22,163,74,0.3); }
.prod-name { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; }
.order-code { display: inline-block; padding: 6px 14px; background: rgba(230,57,70,0.08); color: #e63946; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 0.82rem; letter-spacing: 0.1em; }
.file-card { background: #fff; border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; border: 1px solid rgba(10,10,10,0.06); }
.file-info { flex: 1; min-width: 160px; }
.file-label { font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; }
.file-name { font-size: 0.75rem; color: #6b7280; font-family: 'JetBrains Mono', monospace; word-break: break-all; }
.file-btn { padding: 11px 20px; background: #0a0a0a; color: #fff; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
.file-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(10,10,10,0.25); }
.note-box { margin-top: 20px; padding: 14px 16px; background: rgba(230,57,70,0.06); border: 1px solid rgba(230,57,70,0.2); border-radius: 12px; font-size: 0.82rem; line-height: 1.7; color: #6b7280; }
.note-box b { color: #e63946; }
.error-box { padding: 32px 20px; text-align: center; background: rgba(230,57,70,0.06); border: 1px solid rgba(230,57,70,0.3); border-radius: 14px; }
.error-box h2 { color: #e63946; font-size: 1.1rem; margin-bottom: 8px; }
.loading { text-align: center; padding: 60px 20px; color: #6b7280; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="container">
    <div class="head">
        <a href="index.html"><b>QM</b> MOD iOS</a>
        <a href="index.html" class="back">Trang chủ</a>
    </div>
    <div id="content">
        <div class="loading">Đang tải...</div>
    </div>
</div>

<script>
(async function () {
    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const token = params.get('t') || params.get('token');

    console.log('[download] token:', token ? token.slice(0, 20) + '...' : 'MISSING');

    if (!token) {
        content.innerHTML = `<div class="error-box"><h2>❌ Thiếu token</h2><p>URL không có tham số <code>?t=</code> hoặc <code>?token=</code></p></div>`;
        return;
    }

    try {
        const url = '/api/order-files/' + encodeURIComponent(token);
        const r = await fetch(url, { cache: 'no-store' });
        const text = await r.text();
        let d;
        try { d = JSON.parse(text); } catch { d = null; }

        console.log('[download] status:', r.status, 'data:', d);

        if (!r.ok || !d) {
            content.innerHTML = `<div class="error-box"><h2>❌ Không tải được</h2><p>HTTP ${r.status}</p><p style="font-size:0.75rem;margin-top:8px;">${(text || '').slice(0, 200)}</p></div>`;
            return;
        }

        if (!d.files || !d.files.length) {
            content.innerHTML = `
                <div class="section-header">
                    <div class="section-tag">// TẢI FILE</div>
                    <h1 class="section-title">Danh sách trống</h1>
                    <p class="section-sub">Admin chưa cấu hình file cho sản phẩm này.</p>
                </div>
                <div class="error-box"><h2>⚠ Đơn ${d.order_code || ''}</h2><p>Product: ${d.product_name || 'N/A'}</p></div>
            `;
            return;
        }

        content.innerHTML = `
            <div class="success-block">
                <div class="success-icon">✓</div>
                <div class="prod-name">${d.product_name}</div>
                <div class="order-code">Mã đơn · ${d.order_code}</div>
            </div>
            ${d.files.map((f, i) => `
                <div class="file-card">
                    <div class="file-info">
                        <div class="file-label">${f.label || ('File ' + (i + 1))}</div>
                        <div class="file-name">${f.name || ''}</div>
                    </div>
                    <a class="file-btn" href="${f.url}" download>⬇ TẢI</a>
                </div>
            `).join('')}
            <div class="note-box">
                <b>⚠ Lưu ý:</b> Cần cài ESign trước để cài file IPA. Link riêng cho bạn, đừng chia sẻ.
            </div>
        `;
    } catch (e) {
        console.error('[download] error:', e);
        content.innerHTML = `<div class="error-box"><h2>❌ Lỗi kết nối</h2><p>${e.message}</p></div>`;
    }
})();
</script>
</body>
</html>
